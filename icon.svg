<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Sleeping baby in a rose cradle</title>
  <defs>
    <!-- Background Gradient: Warm Dreamy Maternity / Womb Sky -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A9E" />
      <stop offset="50%" stop-color="#FECFEF" />
      <stop offset="100%" stop-color="#A18CD1" />
    </linearGradient>

    <!-- Mother's Belly / Womb Outer Halo -->
    <radialGradient id="wombHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#FFB6C1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF8DA1" stop-opacity="0" />
    </radialGradient>

    <!-- Womb Chamber Inner Gradient (Warm Amniotic Glow) -->
    <linearGradient id="wombInner" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFF0F5" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFE4E1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFD1DC" stop-opacity="0.9" />
    </linearGradient>

    <!-- Baby Skin Tone Gradient -->
    <radialGradient id="babySkin" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF8F4" />
      <stop offset="60%" stop-color="#FFE3D6" />
      <stop offset="100%" stop-color="#F7C4B2" />
    </radialGradient>

    <!-- Baby Body Shading Gradient -->
    <linearGradient id="babyBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4EE" />
      <stop offset="70%" stop-color="#FEDACD" />
      <stop offset="100%" stop-color="#F5BCA7" />
    </linearGradient>

    <!-- Rosy Cheek Blush -->
    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B8B" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#FF8FA3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFA8B6" stop-opacity="0" />
    </radialGradient>

    <!-- Umbilical Cord Gradient -->
    <linearGradient id="cordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB2C3" />
      <stop offset="50%" stop-color="#FF809B" />
      <stop offset="100%" stop-color="#FFA8BC" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowFilter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5A2A42" flood-opacity="0.2" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />

  <!-- Background Decorative Glowing Stars & Sparkles -->
  <g opacity="0.6">
    <circle cx="80" cy="90" r="40" fill="#FFFFFF" opacity="0.2" />
    <circle cx="430" cy="110" r="50" fill="#FFFFFF" opacity="0.15" />
    <circle cx="420" cy="420" r="60" fill="#FFFFFF" opacity="0.2" />
    <circle cx="90" cy="410" r="35" fill="#FFFFFF" opacity="0.18" />

    <!-- Sparkles -->
    <path d="M 110 140 Q 110 155 95 155 Q 110 155 110 170 Q 110 155 125 155 Q 110 155 110 140 Z" fill="#FFF275" opacity="0.85" filter="url(#glowFilter)" />
    <path d="M 400 200 Q 400 215 385 215 Q 400 215 400 230 Q 400 215 415 215 Q 400 215 400 200 Z" fill="#FFF275" opacity="0.85" filter="url(#glowFilter)" />
    <path d="M 370 80 Q 370 92 358 92 Q 370 92 370 104 Q 370 92 382 92 Q 370 92 370 80 Z" fill="#FFF275" opacity="0.75" />
    <circle cx="150" cy="85" r="4" fill="#FFFFFF" opacity="0.8" />
    <circle cx="340" cy="430" r="5" fill="#FFFFFF" opacity="0.7" />
  </g>

  <!-- Cradle bedding behind the original sleeping baby illustration. -->
  <ellipse cx="256" cy="303" rx="165" ry="75" fill="#fff7f1" stroke="#d99aab" stroke-width="7"/>
  <!-- SLEEPING BABY (Horizontal / Semi-Horizontal Fetal Position) -->
  <g filter="url(#shadowFilter)">
    
    <!-- Baby Body / Curved Back & Bottom -->
    <path d="M 180 230 C 190 190, 280 185, 335 215 C 375 238, 385 285, 360 320 C 330 355, 260 350, 225 320 C 200 298, 175 270, 180 230 Z" 
          fill="url(#babyBodyGrad)" 
          stroke="#F2B8A3" 
          stroke-width="3" />

    <!-- Cute Diaper / Baby Wrap (Pastel White/Cream with soft fold) -->
    <path d="M 305 210 C 345 225, 378 260, 370 305 C 362 335, 325 348, 290 342 C 310 315, 320 280, 305 240 Z" 
          fill="#FFFFFF" 
          stroke="#F0D0C5" 
          stroke-width="3" 
          opacity="0.95" />
    <circle cx="340" cy="275" r="4.5" fill="#FFB2C3" />

    <!-- Baby Curled Legs & Cute Feet -->
    <path d="M 320 285 C 340 315, 325 355, 290 355 C 265 355, 255 330, 275 305 C 290 285, 305 270, 320 285 Z" 
          fill="url(#babySkin)" 
          stroke="#EEB19C" 
          stroke-width="2.5" />
    
    <!-- Tiny Curled Foot & Toes -->
    <g transform="translate(255, 330) rotate(-20)">
      <ellipse cx="18" cy="12" rx="15" ry="10" fill="url(#babySkin)" stroke="#EEB19C" stroke-width="2" />
      <circle cx="6" cy="7" r="3.2" fill="#FAD1C2" />
      <circle cx="11" cy="4" r="2.8" fill="#FAD1C2" />
      <circle cx="17" cy="3" r="2.5" fill="#FAD1C2" />
      <circle cx="23" cy="4" r="2.2" fill="#FAD1C2" />
      <circle cx="28" cy="7" r="2" fill="#FAD1C2" />
      <circle cx="24" cy="14" r="5" fill="url(#cheekBlush)" />
    </g>

    <!-- Baby Chubby Head (Resting on left, semi-horizontal) -->
    <circle cx="170" cy="235" r="62" fill="url(#babySkin)" stroke="#EEB19C" stroke-width="3" />
    
    <!-- Chubby Baby Cheek Puff -->
    <path d="M 130 250 C 130 290, 185 305, 215 275 C 225 255, 220 220, 195 200 C 160 190, 130 210, 130 250 Z" 
          fill="url(#babySkin)" 
          opacity="0.7" />

    <!-- Cute Baby Brown Hair Swirl -->
    <path d="M 145 180 C 135 155, 170 145, 185 160 C 172 162, 160 170, 162 178 Z" fill="#7A4433" />
    <path d="M 175 174 C 185 158, 205 162, 200 176 C 192 174, 182 175, 175 174 Z" fill="#7A4433" />

    <!-- Sleeping Peacefully Closed Eye -->
    <path d="M 142 232 Q 156 244 170 232" 
          fill="none" 
          stroke="#4A2820" 
          stroke-width="3.5" 
          stroke-linecap="round" />
    <path d="M 147 236 L 143 242" stroke="#4A2820" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 156 238 L 156 245" stroke="#4A2820" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 165 236 L 169 242" stroke="#4A2820" stroke-width="2.2" stroke-linecap="round" />

    <!-- Peaceful Soft Eyebrow -->
    <path d="M 140 216 Q 155 208 170 215" 
          fill="none" 
          stroke="#8A5243" 
          stroke-width="2.8" 
          stroke-linecap="round" />

    <!-- Cute Button Nose -->
    <ellipse cx="138" cy="242" rx="4.5" ry="3.5" fill="#EFA28D" />

    <!-- Sweet Sleeping Smile -->
    <path d="M 148 260 Q 160 270 172 261" 
          fill="none" 
          stroke="#7A2D23" 
          stroke-width="3" 
          stroke-linecap="round" />
    <path d="M 174 259 Q 177 263 174 266" stroke="#7A2D23" stroke-width="2" stroke-linecap="round" />

    <!-- Rosy Glowing Baby Cheeks -->
    <circle cx="152" cy="250" r="16" fill="url(#cheekBlush)" />

    <!-- Cute Baby Ear -->
    <g transform="translate(195, 230)">
      <ellipse cx="8" cy="8" rx="12" ry="15" fill="url(#babySkin)" stroke="#EEB19C" stroke-width="2.5" />
      <ellipse cx="8" cy="8" rx="6" ry="8" fill="#F7BFAE" />
    </g>

    <!-- Baby Arm & Tiny Sleeping Hand -->
    <path d="M 195 260 C 185 295, 155 305, 140 285 C 135 275, 145 260, 165 265 Z" 
          fill="url(#babySkin)" 
          stroke="#EEB19C" 
          stroke-width="2.5" />
    
    <g transform="translate(136, 268)">
      <circle cx="8" cy="8" r="8" fill="url(#babySkin)" stroke="#EEB19C" stroke-width="2" />
      <path d="M 4 5 Q 7 3 10 5" stroke="#E59F89" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 4 8 Q 8 6 11 8" stroke="#E59F89" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 5 11 Q 8 9 11 11" stroke="#E59F89" stroke-width="1.8" stroke-linecap="round" />
    </g>

  </g>

  <!-- Rose cradle, rounded posts and curved rocking base. -->
  <g stroke="#ad496c" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 305 Q256 348 412 305 L397 358 Q256 406 115 358 Z" fill="#eab6c8" stroke-width="8"/>
    <path d="M108 307 Q256 352 404 307" fill="none" stroke="#fff4f6" stroke-width="10"/>
    <path d="M153 351 L161 378 M202 363 L207 388 M256 368 L256 394 M310 363 L305 388 M359 351 L351 378" fill="none" stroke-width="6" opacity=".65"/>
    <path d="M159 385 L150 414 M353 385 L362 414 M121 409 Q256 461 391 409" fill="none" stroke-width="13"/>
    <path d="M99 306 L99 284 M413 306 L413 284" fill="none" stroke-width="10"/>
    <circle cx="99" cy="280" r="10" fill="#ad496c" stroke="none"/>
    <circle cx="413" cy="280" r="10" fill="#ad496c" stroke="none"/>
  </g>

  <!-- DREAMY SLEEPING "Z z z" & HEARTS -->
  <g fill="#FFFFFF" opacity="0.9" filter="url(#glowFilter)">
    <path d="M 125 155 L 140 155 L 126 172 L 142 172" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M 102 128 L 114 128 L 103 141 L 115 141" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M 85 108 L 94 108 L 86 118 L 95 118" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <path d="M 285 160 C 282 154, 272 154, 269 161 C 264 170, 285 182, 285 187 C 285 182, 306 170, 301 161 C 298 154, 288 154, 285 160 Z" 
          fill="#FF7597" 
          opacity="0.85" />
    <path d="M 330 140 C 328 135, 320 135, 318 140 C 314 148, 330 156, 330 160 C 330 156, 346 148, 342 140 C 340 135, 332 135, 330 140 Z" 
          fill="#FF9EBA" 
          opacity="0.75" />
  </g>

</svg>
